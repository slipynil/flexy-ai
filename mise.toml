[tools]
python = "3.12"

[env]
_.path = ["./venv/bin"]
_.file = ".env"

# 1. Создание папок
[tasks.setup]
description = "Создание папок для данных"
run = [
    "mkdir -p data",
    "mkdir -p data/generated",
]

# 2. Установка зависимостей через Poetry
[tasks.install]
description = "Установка зависимостей из pyproject.toml через Poetry"
depends = ["setup"]
sources = ["pyproject.toml", "poetry.lock"]
outputs = []
run = "poetry install"

[tasks.generate_txt2img]
description = "Генерация изображения используйте флаг --prompt"
depends = ["install"]
run = "poetry run python -m scripts.run_generate_txt2img"

[tasks.generate_ctx2img]
description = "Генерация изображения используйте флаг --imagepath и --prompt (опционально)"
depends = ["install"]
run = "poetry run python -m scripts.run_generate_ctx2img"

[tasks.register_accounts]
description = "Регистрация аккаунта используйте флаг --counts"
depends = ["install"]
run = "poetry run python -m scripts.run_register_accounts"

[tasks.bot]
description = "Запуск телеграм-бота"
depends = ["install"]
run = "poetry run python -m scripts.run_bot"
